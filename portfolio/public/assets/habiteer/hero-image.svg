<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0f"/>
      <stop offset="55%" stop-color="#1a1008"/>
      <stop offset="100%" stop-color="#3a1a06"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="60%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- ascending XP bars, right side -->
  <g opacity="0.9">
    <rect x="980" y="620" width="60" height="140" rx="6" fill="url(#bar1)"/>
    <rect x="1060" y="540" width="60" height="220" rx="6" fill="url(#bar1)"/>
    <rect x="1140" y="440" width="60" height="320" rx="6" fill="url(#bar1)"/>
    <rect x="1220" y="330" width="60" height="430" rx="6" fill="url(#bar1)"/>
    <rect x="1300" y="230" width="60" height="530" rx="6" fill="url(#bar1)"/>
    <rect x="1380" y="150" width="60" height="610" rx="6" fill="url(#bar1)"/>
  </g>

  <!-- flame motif -->
  <g transform="translate(1280,470)" opacity="0.95">
    <path d="M0,120 C-45,70 -35,20 -10,-30 C-20,10 5,20 5,-10 C15,-45 5,-70 -15,-100 C35,-80 60,-30 45,25 C70,5 80,-25 78,-55 C100,-10 100,55 60,95 C75,80 82,60 82,45 C90,90 55,140 0,120 Z" fill="url(#flame)"/>
  </g>

  <!-- small streak chip row -->
  <g transform="translate(112,520)">
  </g>
</svg>
